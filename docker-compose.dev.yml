name: curve_comfort-dev

services:

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    container_name: curve_comfort-backend-dev
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - ./backend/.env.development
    environment:
      NODE_ENV: development
      ALLOWED_ORIGINS: "http://localhost:5173"
      DEV_ADMIN_NAME: "Development Admin"
      DEV_ADMIN_EMAIL: "admin@curve-comfort.test"
      DEV_ADMIN_MOBILE: "0000000000"
      DEV_ADMIN_PASSWORD: "ChangeMeBeforeProduction!2026"
    ports:
      - "8000:8000"               # exposed to host for direct API access / debugging
    volumes:
      - ./backend/src:/app/src
      - ./backend/seed.js:/app/seed.js:ro
    networks:
      - curve_comfort-dev-net

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    container_name: curve_comfort-frontend-dev
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      # Empty so browser requests go to /api/... and Vite proxy forwards them
      # to http://backend:8000 over the internal Docker network
      VITE_API_BASE_URL: ""
    ports:
      - "5173:5173"               # Vite dev server
    volumes:
      - ./frontend/src:/app/src   # live HMR
    depends_on:
      - backend
    networks:
      - curve_comfort-dev-net

networks:
  curve_comfort-dev-net:
    driver: bridge
